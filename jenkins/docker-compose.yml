services:
  jenkins:
    build: .
    container_name: jenkins
    restart: always
    user: root
    ports:
      - "9080:8080"     # Jenkins UI
      - "50000:50000"   # Jenkins agent
    networks:
      - jenkins-net
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/var/jenkins_home/workspace/webshop  # Mount toàn bộ repo vào đúng workspace


networks:
  jenkins-net:
    driver: bridge

volumes:
  jenkins_home: